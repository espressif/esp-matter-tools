name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Build dm_diff_tool zips and manifest
        run: dm_diff_tool/build_tool.sh

      - name: Prepare Pages content
        run: |
          mkdir public

          # Copy repository index file to public directory
          cp index.html public/index.html

          # Copy DMV Tool to public directory
          mkdir -p public/dmv_tool
          cp -r dmv_tool/ui/* public/dmv_tool/

          # Copy Data Model Diff Tool to public directory
          mkdir -p public/dm_diff_tool
          cp dm_diff_tool/index.html public/dm_diff_tool/
          cp dm_diff_tool/diff_engine.py public/dm_diff_tool/
          cp dm_diff_tool/dm_parser.py public/dm_diff_tool/
          cp dm_diff_tool/dm_differ.py public/dm_diff_tool/
          cp -r dm_diff_tool/static public/dm_diff_tool/
          cp -r dm_diff_tool/data_model public/dm_diff_tool/
          cp dm_diff_tool/data_manifest.json public/dm_diff_tool/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
