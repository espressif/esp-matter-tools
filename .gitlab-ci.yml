# Run MR pipelines when an MR exists, otherwise run branch pipelines.
# This prevents duplicate pipelines when both MR and branch triggers fire.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - build
  - test

ruff_check:
  stage: lint
  image: python:3.9-alpine

  tags:
    - build

  script:
    - python3 -m pip install --upgrade pip "ruff==0.15.17"
    - ruff check .
    - cd mfg_tool
    # TODO - Enable this to other modules as well
    - ruff format --check sources/cli.py
    - ruff format --check tests --exclude tests/deps
    - cd ..
    - ruff format --check dm_diff_tool

build_mfg_tool:
  stage: build
  image: python:${PYTHON_VERSION}-alpine

  tags:
    - build

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

  artifacts:
    paths:
      - mfg_tool/dist/${PYTHON_VERSION}
    expire_in: 1 week

  script:
    - cd mfg_tool
    - mkdir -p dist/${PYTHON_VERSION}
    - python3 -m pip install --upgrade pip build setuptools
    - python3 -m build -o dist/${PYTHON_VERSION}

build_dmv_tool:
  stage: build
  image: python:${PYTHON_VERSION}-alpine

  tags:
    - build

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]

  artifacts:
    paths:
      - dmv_tool/dist/${PYTHON_VERSION}
    expire_in: 1 week

  script:
    - apk add --no-cache
    - cd dmv_tool
    - mkdir -p dist/${PYTHON_VERSION}
    - python3 -m pip install --upgrade pip build setuptools
    - python3 -m build -o dist/${PYTHON_VERSION}

test_mfg_tool:
  stage: test
  image: python:${PYTHON_VERSION}-bullseye # Reliable for evolving test dependencies

  tags:
    - build

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"] # TODO - 3.14 will be added after python:3.14-bullseye will be available

  needs:
    - job: build_mfg_tool
      artifacts: true
      optional: true

  script:
    - cd mfg_tool
    - python3 -m pip install --upgrade pip
    - python3 -m pip install dist/${PYTHON_VERSION}/esp_matter_mfg_tool*.whl
    - python3 -m pip install -r requirements-test.txt
    - python3 -m pytest tests/ -v -s --log-cli-level=INFO


test_dmv_tool:
  stage: test
  image: python:${PYTHON_VERSION}-bullseye

  tags:
    - build

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"] # TODO - 3.14 will be added after python:3.14-bullseye will be available

  needs:
    - job: build_dmv_tool
      artifacts: true
      optional: true

  script:
    - cd dmv_tool
    - python3 -m pip install --upgrade pip
    - python3 -m pip install dist/${PYTHON_VERSION}/esp_matter_dm_validator*.whl
    - python3 -m pip install -r requirements-test.txt
    - python3 -m pytest tests/ -v -s --log-cli-level=INFO


test_dm_diff_tool:
  stage: test
  image: python:${PYTHON_VERSION}-bullseye

  tags:
    - build

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]

  script:
    - cd dm_diff_tool
    - python3 -m pip install --upgrade pip pytest
    - python3 -m pytest tests/ -v -s
